<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Корзина — YoucanSmile</title>
  <meta name="description" content="Корзина и оформление заказа YoucanSmile."/>
  <link rel="icon" href="img/logo-ycs.png"/>
  <script>
    (function () {
      var t = 'sage';
      try { t = localStorage.getItem('ycs_theme') || 'sage'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var href = t === 'purple'
        ? 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap'
        : 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.media = 'print';
      l.onload = function () { this.media = 'all'; };
      document.head.appendChild(l);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="css/styles.css?v=20260813s"/>
</head>
<body>

  <div id="header-root"></div>

  <section class="section" style="padding-top:36px;">
    <div class="container">
      <div class="section-head">
        <h1 data-i18n="cart_title_id">Корзина</h1>
      </div>

      <div class="cart-empty hidden" id="cartEmpty" style="text-align:center; padding:40px 0;">
        <p style="font-size:3.5rem;">🛒</p>
        <h3 style="margin-top:10px;" data-i18n="cart_empty_id">Ваша корзина пока пуста</h3>
        <a class="btn btn-primary" style="margin-top:20px;" href="catalog.html" data-i18n="cart_empty_cta_id">Перейти в каталог</a>
      </div>

      <div class="cart-layout" id="cartLayout">
        <div>
          <div class="cart-list" id="cartList"></div>
        </div>

        <aside class="cart-summary" id="cartSummary">
          <h3 data-i18n="cart_summary_id">Ваш заказ</h3>
          <div class="cs-row"><span data-i18n="cart_items_id">товаров на сумму</span><span id="sumItems"></span></div>
          <div class="cs-row total"><span data-i18n="cart_total_id">Итого</span><b id="sumTotal"></b></div>
          <button class="btn btn-primary" id="checkoutBtn" data-i18n="cart_checkout_id">Оформить заказ</button>
          <p class="cs-note" data-i18n="cart_delivery_note_id">Доставка рассчитывается при подтверждении заказа</p>

          <form class="order-form hidden" id="orderForm">
            <h4 data-i18n="order_title_id">Оформление заказа</h4>
            <p class="cs-note" style="text-align:left; margin:0 0 14px;" data-i18n="checkout_via_id"></p>
            <div class="form-grid">
              <div class="field">
                <label data-i18n="order_name_id">Имя</label>
                <input id="oName" required placeholder="" data-ph-i18n="order_name_ph_id"/>
              </div>
              <div class="field">
                <label data-i18n="order_phone_id">Телефон</label>
                <input id="oPhone" required type="tel" value="+998 " placeholder="+998 __ ___ __ __" data-ph-i18n="order_phone_ph_id"/>
              </div>
              <div class="field full">
                <label data-i18n="contact_channel">Куда написать</label>
                <div class="choice-row">
                  <label class="choice-chip"><input type="radio" name="oContactChannel" value="telegram" checked/> <span data-i18n="contact_telegram">Telegram</span></label>
                  <label class="choice-chip"><input type="radio" name="oContactChannel" value="instagram"/> <span data-i18n="contact_instagram">Instagram</span></label>
                </div>
              </div>
              <div class="field full">
                <label data-i18n="contact_username">Юзернейм</label>
                <input id="oContactUser" required placeholder="@username" data-ph-i18n="contact_username_ph"/>
              </div>
              <div class="field full">
                <label data-i18n="fulfill_title">Способ получения</label>
                <div class="choice-row" id="fulfillRow">
                  <label class="choice-chip"><input type="radio" name="fulfillment" value="pickup" checked/> <span data-i18n="fulfill_pickup">Самовывоз</span></label>
                  <label class="choice-chip"><input type="radio" name="fulfillment" value="delivery"/> <span data-i18n="fulfill_delivery">Доставка</span></label>
                </div>
              </div>
              <div class="field full" id="pickupPointField">
                <label data-i18n="map_pickup_point">Точка самовывоза</label>
                <select id="oPickupPoint" required></select>
                <small class="field-hint" data-i18n="map_pickup_only_list">Выберите точку из списка — её задаёт продавец.</small>
              </div>
              <div class="field full hidden" id="orderMapField">
                <label data-i18n="map_title">Выберите точку на карте</label>
                <div class="ycs-map" id="orderMap"></div>
              </div>
              <div class="field full hidden" id="orderAddressField">
                <label data-i18n="map_address_manual">Или введите адрес вручную</label>
                <input id="oAddress" placeholder="" data-ph-i18n="order_address_ph_id" autocomplete="street-address"/>
              </div>
              <div class="field full">
                <label data-i18n="pay_title">Способ оплаты</label>
                <div class="choice-row" id="payRow">
                  <label class="choice-chip"><input type="radio" name="payment" value="card" checked/> <span data-i18n="pay_card">Карта</span></label>
                  <label class="choice-chip" id="payCashWrap"><input type="radio" name="payment" value="cash"/> <span data-i18n="pay_cash">Наличные</span></label>
                </div>
                <p class="cs-note pay-hint hidden" id="payCardOnly" data-i18n="pay_card_only"></p>
                <div class="pay-requisites hidden" id="payRequisites"></div>
              </div>
              <div class="field full">
                <label data-i18n="order_note_id">Комментарий к заказу</label>
                <textarea id="oNote" placeholder="" data-ph-i18n="order_note_ph_id"></textarea>
              </div>
            </div>
            <button class="btn btn-primary" type="submit" style="width:100%; margin-top:14px;" data-i18n="order_btn_id">Отправить заказ</button>
          </form>

          <div class="order-ok hidden" id="orderOk">
            <p data-i18n="order_ok_id">Спасибо за заказ! Мы свяжемся с вами в ближайшее время 💛</p>
            <p style="margin-top:10px; font-size:0.9rem;"><span data-i18n="order_in_cart_id">Товары из заказа:</span></p>
            <div class="order-links" id="orderLinks" style="justify-content:center;"></div>
          </div>
        </aside>
      </div>

      <!-- избранное вынесено на favorites.html -->
    </div>
  </section>

  <div id="footer-root"></div>

  <script>
    if (location.hash === '#favs') location.replace('favorites.html');
  </script>
  <script src="js/i18n.js?v=20260813s" defer></script>
  <script src="js/api.js?v=20260813s" defer></script>
  <script src="js/theme-apply.js?v=20260813s" defer></script>
  <script src="js/store.js?v=20260813s" defer></script>
  <script src="js/maps.js?v=20260813s" defer></script>
  <script src="js/ui.js?v=20260813s" defer></script>
  <script src="js/push-client.js?v=20260813s" defer></script>
  <script src="js/chat.js?v=20260813s" defer></script>
  <script src="js/cart.js?v=20260813s" defer></script>
</body>
</html>
