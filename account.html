<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="account_title">Личный кабинет — YouCanSmile</title>
  <link rel="icon" href="img/logo-ycs.png"/>
  <script>
    (function () {
      var t = 'sage';
      try { t = localStorage.getItem('ycs_theme') || 'sage'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var href = t === 'purple'
        ? 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap'
        : 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.media = 'print';
      l.onload = function () { this.media = 'all'; };
      document.head.appendChild(l);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="css/styles.css?v=20260814j"/>
</head>
<body>
  <div id="header-root"></div>

  <section class="section account-section">
    <div class="container account-wrap">
      <h1 data-i18n="account_title">Личный кабинет</h1>

      <div id="accountBoot" class="account-boot hidden" aria-live="polite">
        <div class="account-boot-spinner" aria-hidden="true"></div>
        <p class="muted" data-i18n="account_loading">Загружаем кабинет…</p>
      </div>

      <div id="accountGuest" class="hidden">
        <div class="account-tabs">
          <button type="button" class="btn btn-secondary account-tab active" data-tab="login" data-i18n="account_login">Вход</button>
          <button type="button" class="btn btn-secondary account-tab" data-tab="register" data-i18n="account_register">Регистрация</button>
        </div>
        <form id="loginForm" class="account-form card">
          <label><span data-i18n="account_phone">Телефон</span><input type="tel" id="loginPhone" required autocomplete="tel"/></label>
          <label><span data-i18n="account_password">Пароль</span><input type="password" id="loginPassword" required autocomplete="current-password"/></label>
          <button class="btn btn-primary" type="submit" data-i18n="account_login_btn">Войти</button>
          <a class="btn btn-secondary account-google" href="/api/auth/google" data-i18n="account_google">Войти через Google</a>
        </form>
        <form id="registerForm" class="account-form card hidden">
          <label><span data-i18n="account_name">Имя</span><input type="text" id="regName" required autocomplete="name"/></label>
          <label><span data-i18n="account_phone">Телефон</span><input type="tel" id="regPhone" required autocomplete="tel"/></label>
          <label><span data-i18n="account_password">Пароль</span><input type="password" id="regPassword" required minlength="4" autocomplete="new-password"/></label>
          <button class="btn btn-primary" type="submit" data-i18n="account_register_btn">Зарегистрироваться</button>
          <a class="btn btn-secondary account-google" href="/api/auth/google" data-i18n="account_google">Войти через Google</a>
        </form>
      </div>

      <div id="accountUser" class="hidden">
        <div class="account-head card">
          <div>
            <p class="account-greet"><span data-i18n="account_welcome">Здравствуйте</span>, <b id="accountName"></b></p>
            <p class="muted" id="accountPhone"></p>
          </div>
          <button type="button" class="btn btn-secondary" id="logoutBtn" data-i18n="account_logout">Выйти</button>
        </div>

        <h2 data-i18n="account_profile_title">Профиль</h2>
        <p class="account-profile-hint muted" data-i18n="account_profile_hint">Ник, соцсети и адрес сохраняются и подставляются при заказе.</p>
        <form id="profileForm" class="account-form card account-profile-form">
          <label>
            <span data-i18n="account_nick">Ник / имя</span>
            <input type="text" id="profileName" autocomplete="nickname" required/>
          </label>
          <label>
            <span data-i18n="account_phone">Телефон</span>
            <input type="tel" id="profilePhone" autocomplete="tel" placeholder="+998 …"/>
          </label>
          <label>
            <span data-i18n="account_telegram">Telegram</span>
            <input type="text" id="profileTelegram" autocomplete="username" placeholder="@username"/>
          </label>
          <label>
            <span data-i18n="account_instagram">Instagram</span>
            <input type="text" id="profileInstagram" autocomplete="username" placeholder="@username"/>
          </label>
          <label class="full">
            <span data-i18n="account_address">Адрес доставки</span>
            <textarea id="profileAddress" rows="2" placeholder="" data-i18n-placeholder="account_address_ph"></textarea>
          </label>
          <button class="btn btn-primary" type="submit" data-i18n="account_profile_save">Сохранить профиль</button>
        </form>
      </div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script>
    if (location.hash === '#orders') location.replace('orders.html');
  </script>
  <script src="js/i18n.js?v=20260814h" defer></script>
  <script src="js/api.js?v=20260813s" defer></script>
  <script src="js/theme-apply.js?v=20260813s" defer></script>
  <script src="js/store.js?v=20260813s" defer></script>
  <script src="js/ui.js?v=20260814j" defer></script>
  <script src="js/scroll-reveal.js?v=20260814j" defer></script>
  <script src="js/push-client.js?v=20260813s" defer></script>
  <script src="js/chat-lazy.js?v=20260814h" defer></script>
  <script src="js/account.js?v=20260813s" defer></script>
</body>
</html>
