<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Админ-панель — YoucanSmile</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" href="img/logo-ycs.png"/>
  <script>
    (function () {
      var t = 'sage';
      try { t = localStorage.getItem('ycs_theme') || 'sage'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var href = t === 'purple'
        ? 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap'
        : 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.media = 'print';
      l.onload = function () { this.media = 'all'; };
      document.head.appendChild(l);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="css/styles.css?v=20260814f"/>
</head>
<body class="admin-body">

  <div class="admin-wrap">
    <div class="admin-top">
      <div class="container">
        <a class="logo" href="index.html">You<span>can</span>Smile</a>
        <span id="adminTopTitle" style="font-weight:700;"></span>
        <button class="btn btn-sm hidden" id="logoutBtn" data-i18n="admin_logout_id">Выйти</button>
      </div>
    </div>

    <!-- экран входа -->
    <div class="login-card" id="loginCard">
      <h2>🔐 <span data-i18n="admin_title_id">Админ-панель</span></h2>
      <p data-i18n="admin_login_title_id">Вход для администратора</p>
      <form id="loginForm">
        <div class="field">
          <label data-i18n="admin_email_id">Логин (admin)</label>
          <input id="loginEmail" type="text" value="admin" autocomplete="username"/>
        </div>
        <div class="field">
          <label data-i18n="admin_password_id">Пароль</label>
          <input id="loginPass" type="password" autocomplete="current-password"/>
        </div>
        <p class="login-err hidden" id="loginErr" data-i18n="admin_bad_id">Неверный логин или пароль</p>
        <button class="btn btn-primary" type="submit" data-i18n="admin_login_id">Войти</button>
      </form>
    </div>

    <!-- рабочая область -->
    <div class="container admin-layout hidden" id="adminLayout">
      <nav class="admin-nav-wrap" id="adminNavWrap">
        <button type="button" class="h-scroll-nav prev" id="adminNavPrev" aria-label="Назад">‹</button>
        <div class="admin-nav h-scroll-track" id="adminNav">
          <button class="active" data-tab="dash" data-i18n="admin_dash_id">Дашборд</button>
          <button data-tab="products" data-i18n="admin_products_id">Товары</button>
          <button data-tab="categories" data-i18n="admin_categories_id">Категории</button>
          <button data-tab="orders" data-i18n="admin_orders_id">Заказы</button>
          <button data-tab="slider" data-i18n="admin_slider_id">Слайдер</button>
          <button data-tab="settings" data-i18n="admin_settings_id">Настройки</button>
        </div>
        <button type="button" class="h-scroll-nav next" id="adminNavNext" aria-label="Вперёд">›</button>
      </nav>

      <div class="admin-content" id="adminContent"></div>
    </div>
  </div>

  <script src="js/i18n.js?v=20260814d" defer></script>
  <script src="js/api.js?v=20260813ad" defer></script>
  <script src="js/theme-apply.js?v=20260813s" defer></script>
  <script src="js/store.js?v=20260813s" defer></script>
  <script src="js/ui.js?v=20260813w" defer></script>
  <script src="js/push-client.js?v=20260813s" defer></script>
  <script src="js/image-optimize.js?v=20260813af" defer></script>
  <script src="js/admin.js?v=20260813af" defer></script>
</body>
</html>
