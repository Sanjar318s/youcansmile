<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Индивидуальный заказ — YouCanSmile</title>
  <meta name="description" content="Индивидуальный заказ украшений ручной работы: брелок, кулон, чокер, браслет или подвеска для телефона."/>
  <link rel="icon" href="img/logo-ycs.png"/>
  <script>
    (function () {
      var t = 'sage';
      try { t = localStorage.getItem('ycs_theme') || 'sage'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var href = t === 'purple'
        ? 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap'
        : 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.media = 'print';
      l.onload = function () { this.media = 'all'; };
      document.head.appendChild(l);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="css/styles.css?v=20260813y"/>
</head>
<body>
  <div id="header-root"></div>

  <section class="section" style="padding-top:36px;">
    <div class="container custom-order-page">
      <div class="section-head" style="text-align:left;">
        <span class="kicker" data-i18n="custom_nav">Индивидуальный заказ</span>
        <h1 data-i18n="custom_title">Индивидуальный заказ</h1>
      </div>

      <form class="order-form custom-order-form" id="customForm">
        <div class="form-section">
          <h3 data-i18n="custom_section_what">Что нужно</h3>
          <div class="form-grid">
            <div class="field full">
              <label data-i18n="custom_desc">Описание товара</label>
              <textarea id="cDesc" required rows="5" data-ph-i18n="custom_desc_ph"></textarea>
            </div>
            <div class="field full">
              <label data-i18n="custom_character_photo">Референс или фото идеи</label>
              <div class="upload-field">
                <label class="pay-receipt-label">
                  <input type="file" accept="image/*" id="cCharacterPhoto"/>
                  <span class="pay-receipt-btn" data-i18n="custom_character_photo_btn">Загрузить фото</span>
                </label>
                <div class="upload-preview" id="cCharacterPreview" data-i18n="custom_character_photo_empty">Превью появится здесь</div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3 data-i18n="custom_section_contacts">Контакты</h3>
          <div class="form-grid">
            <div class="field">
              <label data-i18n="order_name_id">Имя</label>
              <input id="cName" required data-ph-i18n="order_name_ph_id"/>
            </div>
            <div class="field">
              <label data-i18n="order_phone_id">Телефон</label>
              <input id="cPhone" required type="tel" value="+998 " placeholder="+998 __ ___ __ __" data-ph-i18n="order_phone_ph_id"/>
            </div>
            <div class="field full">
              <label data-i18n="contact_channel">Куда написать</label>
              <div class="choice-row">
                <label class="choice-chip"><input type="radio" name="cContactChannel" value="telegram" checked/> <span data-i18n="contact_telegram">Telegram</span></label>
                <label class="choice-chip"><input type="radio" name="cContactChannel" value="instagram"/> <span data-i18n="contact_instagram">Instagram</span></label>
              </div>
            </div>
            <div class="field full">
              <label data-i18n="contact_username">Юзернейм</label>
              <input id="cContact" required data-ph-i18n="contact_username_ph" placeholder="@username"/>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3 data-i18n="custom_section_fulfill">Получение</h3>
          <div class="field full">
            <p class="custom-seller-note" data-i18n="custom_seller_note">Продавец свяжется с вами, чтобы уточнить детали заказа.</p>
          </div>
        </div>

        <button class="btn btn-primary btn-lg" type="submit" style="width:100%;margin-top:18px;" data-i18n="custom_submit">Отправить заявку</button>
      </form>

      <div class="order-ok custom-ok hidden" id="customOk">
        <div class="checkmark-wrap" aria-hidden="true">
          <svg class="checkmark" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="24" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14 27l8 8 16-16"/>
          </svg>
        </div>
        <h3 data-i18n="custom_success_title">Заказ передан продавцу</h3>
        <p data-i18n="custom_success_sub">Мы передали ваш заказ продавцу. Он свяжется с вами, чтобы уточнить детали.</p>
      </div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="js/i18n.js?v=20260813u" defer></script>
  <script src="js/api.js?v=20260813s" defer></script>
  <script src="js/theme-apply.js?v=20260813s" defer></script>
  <script src="js/store.js?v=20260813s" defer></script>
  <script src="js/ui.js?v=20260813w" defer></script>
  <script src="js/push-client.js?v=20260813s" defer></script>
  <script src="js/chat-lazy.js?v=20260813u" defer></script>
  <script src="js/custom-order.js?v=20260813s" defer></script>
</body>
</html>
