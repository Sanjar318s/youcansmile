<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Товар — YoucanSmile</title>
  <meta name="description" content="Авторские брелки и украшения ручной работы YoucanSmile."/>
  <link rel="icon" href="img/logo-ycs.png"/>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ycs_theme') || 'sage';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'sage');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

  <div id="header-root"></div>

  <section class="section" style="padding-top:36px;">
    <div class="container">
      <div class="pd-grid" id="pdGrid"></div>

      <section class="pd-reviews-wrap" id="pdReviews"></section>

      <div class="section" style="padding-bottom:0;">
        <div class="section-head">
          <h2 data-i18n="product_related_id">Вам может понравиться</h2>
        </div>
        <div class="products-grid" id="relatedGrid"></div>
      </div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/theme-apply.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
