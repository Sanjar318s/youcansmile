<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Sage circle badge -->
  <circle cx="100" cy="100" r="100" fill="#7d936a"/>

  <!-- Hand-drawn outer ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#f3ead6" stroke-width="1.6" stroke-linecap="round"
    stroke-dasharray="8 3 14 2 10 4" opacity="0.95"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#f3ead6" stroke-width="0.9" opacity="0.55"/>

  <!-- Arched wordmark: YOU CAN -->
  <defs>
    <path id="arcTop" d="M 42 78 A 62 62 0 0 1 158 78"/>
    <path id="arcBot" d="M 40 128 A 64 64 0 0 0 160 128"/>
  </defs>
  <text fill="#f3ead6" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="2.2">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">YOU CAN</textPath>
  </text>
  <text fill="#f3ead6" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="1.8">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">SMILE SHOP</textPath>
  </text>

  <!-- Stars on the right -->
  <g fill="#f3ead6">
    <path d="M148 100 l2.2 4.6 5 .7-3.6 3.5 .8 5-4.4-2.3-4.4 2.3 .8-5-3.6-3.5 5-.7z"/>
    <path d="M158 112 l1.3 2.7 3 .4-2.2 2.1 .5 3-2.6-1.4-2.6 1.4 .5-3-2.2-2.1 3-.4z" opacity="0.9"/>
  </g>

  <!-- Cream mochi cat -->
  <g transform="translate(100 104)">
    <!-- ears -->
    <path d="M-28 -22 Q-34 -48 -10 -30" fill="none" stroke="#e8dfc8" stroke-width="7" stroke-linecap="round"/>
    <path d="M28 -22 Q34 -48 10 -30" fill="none" stroke="#e8dfc8" stroke-width="7" stroke-linecap="round"/>
    <path d="M-28 -22 Q-34 -48 -10 -30" fill="none" stroke="#c9b88a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M28 -22 Q34 -48 10 -30" fill="none" stroke="#c9b88a" stroke-width="2.2" stroke-linecap="round"/>

    <!-- head blob -->
    <ellipse cx="0" cy="2" rx="34" ry="30" fill="#f3ead6" stroke="#c9b88a" stroke-width="2"/>

    <!-- sprout -->
    <line x1="0" y1="-28" x2="0" y2="-42" stroke="#5c6f4a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M0 -40 Q-10 -48 -12 -38 Q-4 -40 0 -34 Z" fill="#6f855c"/>
    <path d="M0 -40 Q10 -48 12 -38 Q4 -40 0 -34 Z" fill="#7d936a"/>

    <!-- eyes -->
    <circle cx="-11" cy="-2" r="3.2" fill="#2c2c2c"/>
    <circle cx="11" cy="-2" r="3.2" fill="#2c2c2c"/>

    <!-- w mouth -->
    <path d="M-5 10 Q-2.5 14 0 10 Q2.5 14 5 10" fill="none" stroke="#2c2c2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- whiskers -->
    <g stroke="#6f855c" stroke-width="2" stroke-linecap="round">
      <line x1="-28" y1="4" x2="-18" y2="5"/>
      <line x1="-28" y1="10" x2="-18" y2="10"/>
      <line x1="28" y1="4" x2="18" y2="5"/>
      <line x1="28" y1="10" x2="18" y2="10"/>
    </g>
  </g>
</svg>
