<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chat cat">
  <defs>
    <radialGradient id="bg" cx="42%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#97ab82"/>
      <stop offset="100%" stop-color="#6f855c"/>
    </radialGradient>
    <radialGradient id="fur" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8ef"/>
      <stop offset="100%" stop-color="#efe3c8"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#f6eedc" stroke-width="2.2" opacity="0.55"/>

  <!-- cat -->
  <g transform="translate(64 70)">
    <!-- ears -->
    <path d="M-30 -26 Q-36 -56 -8 -34" fill="#efe3c8" stroke="#c9b88a" stroke-width="2"/>
    <path d="M30 -26 Q36 -56 8 -34" fill="#efe3c8" stroke="#c9b88a" stroke-width="2"/>
    <path d="M-26 -30 Q-28 -46 -12 -34" fill="#f2c4b0" opacity="0.85"/>
    <path d="M26 -30 Q28 -46 12 -34" fill="#f2c4b0" opacity="0.85"/>

    <!-- head -->
    <ellipse cx="0" cy="0" rx="36" ry="32" fill="url(#fur)" stroke="#c9b88a" stroke-width="2"/>

    <!-- sprout -->
    <line x1="0" y1="-30" x2="0" y2="-46" stroke="#5c6f4a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 -44 Q-11 -54 -13 -42 Q-4 -44 0 -36 Z" fill="#6f855c"/>
    <path d="M0 -44 Q11 -54 13 -42 Q4 -44 0 -36 Z" fill="#89a071"/>

    <!-- blush -->
    <ellipse cx="-18" cy="6" rx="7" ry="4.2" fill="#f0b7a4" opacity="0.55"/>
    <ellipse cx="18" cy="6" rx="7" ry="4.2" fill="#f0b7a4" opacity="0.55"/>

    <!-- eyes -->
    <circle cx="-12" cy="-4" r="3.4" fill="#2c2c2c"/>
    <circle cx="12" cy="-4" r="3.4" fill="#2c2c2c"/>
    <circle cx="-11" cy="-5.2" r="1.1" fill="#fff"/>
    <circle cx="13" cy="-5.2" r="1.1" fill="#fff"/>

    <!-- nose + mouth -->
    <ellipse cx="0" cy="4" rx="2.2" ry="1.6" fill="#e39a86"/>
    <path d="M0 5.5 Q-4 12 -8 9" fill="none" stroke="#2c2c2c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0 5.5 Q4 12 8 9" fill="none" stroke="#2c2c2c" stroke-width="1.8" stroke-linecap="round"/>

    <!-- whiskers -->
    <g stroke="#8a9a72" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
      <line x1="-34" y1="2" x2="-20" y2="4"/>
      <line x1="-34" y1="9" x2="-20" y2="9"/>
      <line x1="34" y1="2" x2="20" y2="4"/>
      <line x1="34" y1="9" x2="20" y2="9"/>
    </g>
  </g>
</svg>
