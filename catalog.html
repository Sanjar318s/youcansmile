<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Каталог — YoucanSmile</title>
  <meta name="description" content="Каталог брелков и украшений ручной работы YoucanSmile."/>
  <link rel="icon" href="img/logo-ycs.png"/>
  <script>
    (function () {
      var t = 'sage';
      try { t = localStorage.getItem('ycs_theme') || 'sage'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var href = t === 'purple'
        ? 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap'
        : 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.media = 'print';
      l.onload = function () { this.media = 'all'; };
      document.head.appendChild(l);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="css/styles.css?v=20260813y"/>
</head>
<body>

  <div id="header-root"></div>

  <section class="section catalog-hero" style="padding-bottom:16px;">
    <div class="container">
      <div class="section-head">
        <span class="kicker">Магазин</span>
        <h1 data-i18n="catalog_title_id">Каталог</h1>
        <p data-i18n="catalog_subtitle_id">Брелки, кулоны, чокеры, браслеты и подвески для телефона</p>
      </div>
    </div>
  </section>

  <section class="section catalog-section" style="padding-top:4px;">
    <div class="container">
      <div class="catalog-layout">
        <!-- фильтры -->
        <aside class="filters" id="filters">
          <button type="button" class="filters-toggle" id="filtersToggle" aria-expanded="false" aria-controls="filtersBody">
            <span data-i18n="filter_filters">Фильтры</span>
            <svg class="filters-toggle-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="filters-body" id="filtersBody">
          <h3 data-i18n="filter_category_id">Категория</h3>
          <div class="filter-group">
            <div class="h-scroll-row" id="catChipsRow">
              <button type="button" class="h-scroll-nav prev" aria-label="Назад">‹</button>
              <div class="chips h-scroll-track" id="catChips"></div>
              <button type="button" class="h-scroll-nav next" aria-label="Вперёд">›</button>
            </div>
          </div>

          <div class="filter-group">
            <label data-i18n="filter_price_id">Цена</label>
            <div class="price-inputs">
              <input type="number" id="priceFrom" placeholder="от" min="0" inputmode="numeric"/>
              <span class="price-sep" aria-hidden="true">—</span>
              <input type="number" id="priceTo" placeholder="до" min="0" inputmode="numeric"/>
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-row">
              <input type="checkbox" id="onlyDiscount"/>
              <span data-i18n="filter_only_discount_id">Только со скидкой</span>
            </label>
            <label class="filter-row">
              <input type="checkbox" id="onlyStock"/>
              <span data-i18n="filter_in_stock_id">Только в наличии</span>
            </label>
          </div>

          <button class="btn btn-ghost btn-sm" id="resetFilters" data-i18n="filter_reset_id">Сбросить</button>
          </div>
        </aside>

        <!-- товары -->
        <div class="catalog-main">
          <div class="catalog-top">
            <span class="count" id="countLabel"></span>
            <select class="sort-select" id="sortSelect">
              <option value="popular" data-i18n="sort_popular_id">Популярные</option>
              <option value="new" data-i18n="sort_new_id">Сначала новые</option>
              <option value="price_asc" data-i18n="sort_price_asc_id">Сначала дешевле</option>
              <option value="price_desc" data-i18n="sort_price_desc_id">Сначала дороже</option>
            </select>
          </div>
          <div class="products-grid" id="catalogGrid"></div>
          <div class="catalog-empty hidden" id="catalogEmpty">
            <h3 data-i18n="no_products_id">По вашему запросу ничего не найдено</h3>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="js/i18n.js?v=20260813aa" defer></script>
  <script src="js/api.js?v=20260813s" defer></script>
  <script src="js/theme-apply.js?v=20260813s" defer></script>
  <script src="js/store.js?v=20260813s" defer></script>
  <script src="js/ui.js?v=20260813w" defer></script>
  <script src="js/push-client.js?v=20260813s" defer></script>
  <script src="js/chat-lazy.js?v=20260813u" defer></script>
  <script src="js/catalog.js?v=20260813w" defer></script>
</body>
</html>
