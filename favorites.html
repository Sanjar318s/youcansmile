<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="fav_title">Избранное — YouCanSmile</title>
  <link rel="icon" href="img/logo-ycs.png"/>
  <script>
    (function () {
      var t = 'sage';
      try { t = localStorage.getItem('ycs_theme') || 'sage'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var href = t === 'purple'
        ? 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap'
        : 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.media = 'print';
      l.onload = function () { this.media = 'all'; };
      document.head.appendChild(l);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="css/styles.css?v=20260814j"/>
</head>
<body>
  <div id="header-root"></div>

  <section class="section" style="padding-top:36px;">
    <div class="container">
      <div class="section-head">
        <h1 data-i18n="fav_title">Избранное</h1>
      </div>
      <div class="products-grid" id="favGrid"></div>
      <div class="catalog-empty hidden" id="favEmpty">
        <p data-i18n="fav_empty">В избранном пока пусто. Жмите на сердечко у понравившихся товаров!</p>
        <a class="btn btn-primary" style="margin-top:16px;" href="catalog.html" data-i18n="fav_empty_cta">Выбрать товары</a>
      </div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="js/i18n.js?v=20260814h" defer></script>
  <script src="js/api.js?v=20260813s" defer></script>
  <script src="js/theme-apply.js?v=20260813s" defer></script>
  <script src="js/store.js?v=20260813s" defer></script>
  <script src="js/ui.js?v=20260814j" defer></script>
  <script src="js/scroll-reveal.js?v=20260814j" defer></script>
  <script src="js/push-client.js?v=20260813s" defer></script>
  <script src="js/chat-lazy.js?v=20260814h" defer></script>
  <script src="js/favorites.js?v=20260813s" defer></script>
</body>
</html>
