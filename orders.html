<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="account_orders">История заказов — YouCanSmile</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" href="img/logo-ycs.png"/>
  <script>
    (function () {
      var t = 'sage';
      try { t = localStorage.getItem('ycs_theme') || 'sage'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var href = t === 'purple'
        ? 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap'
        : 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.media = 'print';
      l.onload = function () { this.media = 'all'; };
      document.head.appendChild(l);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="css/styles.css?v=20260820b"/>
</head>
<body>
  <div id="header-root"></div>

  <section class="section account-section">
    <div class="container account-wrap">
      <h1 data-i18n="account_orders">История заказов</h1>
      <p class="account-orders-hint muted" data-i18n="account_orders_hint">Все заказы со статусом — в том числе отменённые. Можно открыть подробности или написать продавцу.</p>

      <div id="ordersGuest" class="hidden">
        <div class="account-form card">
          <p data-i18n="account_orders_login">Войдите в кабинет, чтобы видеть историю заказов.</p>
          <a class="btn btn-primary" href="account.html" data-i18n="account_login_btn">Войти</a>
        </div>
      </div>

      <div id="ordersUser" class="hidden">
        <div id="ordersList" class="account-orders"></div>
        <p class="catalog-empty hidden" id="ordersEmpty" data-i18n="account_orders_empty">Заказов пока нет.</p>
      </div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="js/i18n.js?v=20260814n" defer></script>
  <script src="js/api.js?v=20260813s" defer></script>
  <script src="js/theme-apply.js?v=20260813s" defer></script>
  <script src="js/store.js?v=20260813s" defer></script>
  <script src="js/ui.js?v=20260820b" defer></script>
  <script src="js/scroll-reveal.js?v=20260814k" defer></script>
  <script src="js/push-client.js?v=20260813s" defer></script>
  <script src="js/chat-lazy.js?v=20260814n" defer></script>
  <script src="js/orders-page.js?v=20260813s" defer></script>
</body>
</html>
